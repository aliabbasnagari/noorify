name: ui_mobile
description: "Navidrome mobile client with full feature parity to new-ui"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  go_router: ^14.0.0
  just_audio: ^0.9.40
  audio_service: ^0.18.14
  cached_network_image: ^3.3.1
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
